<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:"Segoe UI",sans-serif;
}

body{
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

/* Main Card */

.success-container{

background:white;
padding:40px 35px;
border-radius:18px;
max-width:500px;
width:100%;
text-align:center;

box-shadow:0 25px 60px rgba(0,0,0,0.25);

animation:fadeIn .6s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(25px);}
to{opacity:1; transform:translateY(0);}
}

/* Check Icon */

.checkmark{

width:90px;
height:90px;
margin:0 auto 20px;

background:#22c55e;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

font-size:45px;
color:white;

box-shadow:0 10px 30px rgba(34,197,94,0.4);

animation:pop .5s ease;
}

@keyframes pop{
0%{transform:scale(.5);opacity:0;}
100%{transform:scale(1);opacity:1;}
}

/* Titles */

.success-container h1{
font-size:26px;
color:#16a34a;
margin-bottom:10px;
}

.success-container h3{
font-size:20px;
color:#1f2937;
margin-bottom:15px;
}

/* Text */

.success-container p{

font-size:15px;
color:#4b5563;
line-height:1.6;
margin-bottom:10px;
}

/* Button */

.btn-dashboard{

display:inline-block;
margin-top:25px;

padding:12px 22px;

background:linear-gradient(135deg,#1e3c72,#2a5298);
color:white;

text-decoration:none;
border-radius:8px;

font-weight:600;
transition:.3s;
}

.btn-dashboard:hover{

transform:translateY(-2px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);

}

/* Small note */

.note{
margin-top:15px;
font-size:13px;
color:#6b7280;
}

/* Mobile */

@media(max-width:480px){

.success-container{
padding:30px 20px;
}

.success-container h1{
font-size:22px;
}

.success-container h3{
font-size:18px;
}

}

</style>
</head>

<body>

<div class="success-container">

<div class="checkmark">
✓
</div>

<h1>Payment Successful</h1>

<h3>Tour Successfully Booked!</h3>

<p>
Your tour booking has been successfully completed and is now awaiting confirmation from the tour guide.
</p>

<p>
You can track the status anytime from your profile dashboard.
</p>

<a href="{{ url_for('profile') }}" class="btn-dashboard">
Go to Dashboard
</a>

<div class="note">
Thank you for booking with us ✈️
</div>

</div>

</body>
</html>
