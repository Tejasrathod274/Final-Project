<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment | Travel & Tour</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
</head>
<style>
    body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Main Container */
.payment-container {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Card */
.payment-card {
    background: white;
    padding: 40px;
    width: 420px;
    border-radius: 15px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

.payment-card h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #1e3c72;
}

/* Booking Summary */
.booking-summary {
    background: #f4f6f9;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 25px;
    font-size: 14px;
}

.booking-summary p {
    margin: 6px 0;
}

/* Input Groups */
.input-group {
    display: flex;
    flex-direction: column;
    margin-bottom: 15px;
}

.input-group label {
    font-size: 13px;
    margin-bottom: 5px;
    font-weight: bold;
}

.input-group input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: 0.3s;
}

.input-group input:focus {
    border-color: #2a5298;
    outline: none;
}

/* Row for expiry & CVV */
.row {
    display: flex;
    gap: 10px;
}

.small {
    flex: 1;
}

/* Button */
.pay-btn {
    width: 100%;
    padding: 12px;
    border: none;
    background: #2a5298;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
}

.pay-btn:hover {
    background: #1e3c72;
}
</style>
<body>

<div class="payment-container">

    <div class="payment-card">

        <h2>💳 Complete Your Payment</h2>

        <div class="booking-summary">
            <p><strong>Destination:</strong> {{ booking.destination }}</p>
            <p><strong>Tour:</strong> {{ booking.tour_name }}</p>
            <p><strong>Total Amount:</strong> ₹{{ booking.total_amount }}</p>
        </div>

        <form method="POST" action="{{ url_for('confirm_payment') }}" class="payment-form">

            <div class="input-group">
                <label>Card Holder Name</label>
                <input type="text" placeholder="John Doe" required>
            </div>

            <div class="input-group">
                <label>Card Number</label>
                <input type="text" placeholder="1234 5678 9012 3456" maxlength="19" required>
            </div>

            <div class="row">
                <div class="input-group small">
                    <label>Expiry Date</label>
                    <input type="text" placeholder="MM/YY" required>
                </div>

                <div class="input-group small">
                    <label>CVV</label>
                    <input type="password" placeholder="123" maxlength="3" required>
                </div>
            </div>

            <button type="submit" class="pay-btn">
                💰 Pay Now
            </button>

        </form>

    </div>

</div>

</body>
</html>
